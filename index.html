<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101318">
    <meta name="description" content="A hands-on, interactive Microsoft SQL Server DBA course taught in T-SQL for SQL analysts.">
    <title>DBA Academy — Microsoft SQL Server and T-SQL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-page="overview" aria-label="DBA Academy home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-name">dba<span>academy</span></span>
        </a>

        <div class="workspace-label">YOUR WORKSPACE</div>
        <nav class="primary-nav">
          <button class="nav-item active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-page="path"><span class="nav-icon">▤</span>Learning path <span class="nav-count">11</span></button>
          <button class="nav-item" data-page="lab"><span class="nav-icon">⌘</span>T-SQL playground <span class="nav-live"></span></button>
          <button class="nav-item" data-page="quiz"><span class="nav-icon">◈</span>Knowledge checks</button>
          <button class="nav-item" data-page="fieldguide"><span class="nav-icon">▧</span>Field guide</button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="workspace-label">YOUR PROGRESS</div>
        <div class="sidebar-progress">
          <div class="progress-copy"><span>Course completion</span><strong id="sidebar-progress-label">0%</strong></div>
          <div class="progress-track"><span id="sidebar-progress-bar" style="width:0%"></span></div>
          <p>Small steps. Serious systems skills.</p>
        </div>

        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-orbit">✳</div>
            <strong>Curiosity is a superpower.</strong>
            <span>Ask “what happens when it fails?”</span>
          </div>
          <div class="profile">
            <div class="avatar">DB</div>
            <div><strong>Database learner</strong><span>Explorer · Level 1</span></div>
            <button class="more-button" aria-label="Profile options">···</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><span>Academy</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <div class="streak-pill"><span>✦</span><strong id="streak-count">0</strong><span>day streak</span></div>
            <button class="icon-button" id="search-open" aria-label="Search lessons"><span>⌕</span></button>
            <button class="top-avatar" aria-label="Your profile">DB</button>
          </div>
        </header>
        <div id="page-content" class="page-content"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="search-dialog" class="search-dialog">
      <form method="dialog" class="search-box">
        <span class="search-symbol">⌕</span>
        <input id="search-input" type="search" placeholder="Search lessons, concepts, shortcuts…" aria-label="Search course">
        <button class="search-close" value="close" aria-label="Close search">Esc</button>
      </form>
      <div id="search-results" class="search-results"></div>
    </dialog>
  </body>
</html>
